[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "synapse"
version = "0.1.0"
description = "Agentic pharmacology research assistant (Syntax GenAI Bootcamp)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.162.5",
    "uvicorn[standard]==0.54.0",
    "pydantic==2.14.3",
    "pydantic-settings==2.16.2",
    "openai==3.49.0",
    "numpy==2.4.6",
]

[project.optional-dependencies]
dev = [
    "pytest==9.2.0",
    "pytest-asyncio==1.4.1.post1",
    "pytest-cov==7.1.0",
    "pytest-socket==0.8.1",
    "httpx==0.28.1",
    "httpx2==2.16.0",
    "ruff==0.17.4",
    "mypy==2.4.1",
    "pyyaml==6.0.3",
]

[tool.setuptools.packages.find]
where = ["backend"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "W"]

[tool.ruff.lint.isort]
known-first-party = ["app", "tests"]

[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = "backend"
files = ["backend/app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["backend/tests"]
pythonpath = ["backend"]
markers = [
    "real_providers: opt out of the autouse fake-provider fixture",
    "llm_live: live-LLM evaluation (excluded from default runs)",
]
addopts = "-m 'not llm_live'"
